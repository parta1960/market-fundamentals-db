name: "Rebuild JSON (no price pull)"

# Regenerates docs/data/*.json from the parquet already in the repo:
# derived.build() -> history_export.build() -> peg.build(). Makes NO price API
# calls, so it finishes in minutes instead of the ~80 the daily update needs.
# Use after an ETL change that only affects how existing data is exported.
on:
  workflow_dispatch:
    inputs:
      fetch_forward_peg:
        description: "true = also re-fetch Alpha Vantage forward PEG (slow)"
        default: "false"

permissions:
  contents: write

concurrency:
  group: etl-writes
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild derived metrics + JSON exports
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          FETCH_FWD_PEG: ${{ github.event.inputs.fetch_forward_peg }}
        run: |
          PYTHONPATH=etl python - <<'EOF'
          import os
          import derived, history_export
          derived.build()
          history_export.build()
          try:
              import peg
              peg.build(fetch_forward=os.environ.get("FETCH_FWD_PEG") == "true")
          except Exception as e:
              print(f"peg step failed (non-fatal): {e}")
          EOF

      - name: Commit results
        if: always()
        run: |
          git config user.name "etl-bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "rebuild JSON exports [skip ci]" || echo "nothing to commit"
          git pull --rebase && git push
