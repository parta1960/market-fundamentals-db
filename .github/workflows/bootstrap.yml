name: "Bootstrap v0.1"

# Runs when payload.zip is uploaded (or manually from the Actions tab).
# Unpacks the pipeline, runs the 10-ticker pilot, commits code + data + QA report.

on:
  push:
    paths:
      - "payload.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unpack pipeline files
        run: unzip -o payload.zip && find etl -type f

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pilot backfill (10 tickers)
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: PYTHONPATH=etl python etl/pilot_backfill.py

      - name: Publish QA report to run summary
        if: always()
        run: cat reports/pilot_qa_v0.1.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Commit results
        if: always()
        run: |
          git config user.name "etl-bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "v0.1.0 pilot: code + data + QA report [skip ci]" || echo "nothing to commit"
          git push
