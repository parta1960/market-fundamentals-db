- uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Materialize pipeline files
    run: |
      mkdir -p "$(dirname "README.md")"
      printf '%s' '' | base64 -d > "README.md" 
      mkdir -p "$(dirname "CHANGELOG.md")"
      printf '%s' '' | base64 -d > "CHANGELOG.md" 
      mkdir -p "$(dirname "schema.md")"
      printf '%s' '' | base64 -d > "schema.md" 
      mkdir -p "$(dirname "requirements.txt")"
      printf '%s' 'cmVxdWVzdHM+PTIuMzEKcGFuZGFzPj0yLjEKcHlhcnJvdz49MTQuMApkdWNrZGI+PTAuMTAK' | base64 -d > "requirements.txt" 
      mkdir -p "$(dirname ".gitignore")"
      printf '%s' 'X19weWNhY2hlX18vCioucHljCi5EU19TdG9yZQpkYi8qLmR1Y2tkYgo=' | base64 -d > ".gitignore" 
      mkdir -p "$(dirname "etl/config.py")"
      printf '%s' '' | base64 -d > "etl/config.py" 
      mkdir -p "$(dirname "etl/av_client.py")"
      printf '%s' '' | base64 -d > "etl/av_client.py" 
      mkdir -p "$(dirname "etl/edgar_client.py")"
      printf '%s' '' | base64 -d > "etl/edgar_client.py" 
      mkdir -p "$(dirname "etl/pilot_backfill.py")"
      printf '%s' '' | base64 -d > "etl/pilot_backfill.py" 
      mkdir -p "$(dirname ".github/workflows/pilot-backfill.yml")"
      printf '%s' '' | base64 -d > ".github/workflows/pilot-backfill.yml" 
      echo "Files written:" && git status --short

  - name: Install dependencies
    run: pip install -r requirements.txt

  - name: Run pilot backfill (10 tickers)
    env:
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
    run: PYTHONPATH=etl python etl/pilot_backfill.py

  - name: Publish QA report to job summary
    if: always()
    run: cat reports/pilot_qa_v0.1.md >> "$GITHUB_STEP_SUMMARY" || true

  - name: Commit everything
    if: always()
    run: |
      git config user.name "etl-bot"
      git config user.email "actions@github.com"
      git add -A
      git commit -m "v0.1.0 bootstrap: pipeline code + pilot data + QA report [skip ci]" || echo "nothing to commit"
      git push

  - name: Upload QA report artifact
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: pilot-qa-report
      path: reports/
