name: "Daily update (v0.4)"

# 22:45 UTC weekdays = 6:45 pm EDT / 5:45 pm EST — after US market close year-round.
on:
  schedule:
    - cron: "45 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: etl-writes
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily update
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: PYTHONPATH=etl python etl/daily_update.py

      - name: Commit results
        if: always()
        run: |
          git config user.name "etl-bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "daily update $(date -u +%Y-%m-%d) [skip ci]" || echo "nothing to commit"
          git pull --rebase && git push
